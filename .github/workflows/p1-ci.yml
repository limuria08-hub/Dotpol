name: P1 local research
on:
  pull_request:
    paths:
      - "platform/**"
      - "services/api/**"
      - "apps/web/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/p1-ci.yml"
  push:
    branches: [main]
    paths:
      - "platform/**"
      - "services/api/**"
      - "apps/web/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/p1-ci.yml"
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
