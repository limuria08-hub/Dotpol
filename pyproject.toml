[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dotpol-platform"
version = "0.1.0"
description = "Dotpol local-first political research foundation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3", "pydantic-ai-slim[openai]>=1,<2"]
[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
[tool.setuptools]
package-dir = {"" = "platform/src"}
[tool.setuptools.packages.find]
where = ["platform/src"]
[tool.pytest.ini_options]
pythonpath = ["platform/src", "services/api"]
testpaths = ["tests"]
