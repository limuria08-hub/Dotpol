version: "1.0"
status: frozen-phase-0
principles:
  local_first: true
  zero_cost_core: true
  reuse_before_build: true
  one_capability_one_owner: true
  one_canonical_domain_model: true
  provenance_required: true
  deterministic_engines_for_calculation: true
capabilities:
  - id: ai-model-gateway
    owner: platform/ai
    status: planned
    roadmap_phase: 1
    consumers: [agents, all-domains]
    rule: "All model providers route through one Dotpol-owned interface."
  - id: agent-runtime
    owner: platform/ai
    status: planned
    roadmap_phase: 1
    preferred_dependency: PydanticAI
    consumers: [agents]
  - id: tool-registry
    owner: platform/ai
    status: planned
    roadmap_phase: 1
    consumers: [agents]
  - id: search
    owner: platform/search
    status: planned
    roadmap_phase: 3
    donor: Vane
    consumers: [research, elections, policy, legislation, media]
  - id: semantic-retrieval
    owner: platform/search
    status: planned
    roadmap_phase: 3
    preferred_local_candidate: LanceDB
    rule: "No parallel production RAG stacks without ADR and evaluation evidence."
  - id: data-ingestion
    owner: platform/data
    status: planned
    roadmap_phase: 2
    preferred_dependency: dlt
    consumers: [connectors, all-domains]
