# Single execution plan for agents and collaborators. Specifications live in docs/ROADMAP.md.
# None of these phases is verified complete. Status only changes with linked PR/tests.
version: "1.1"
as_of: "2026-10-30"
plan: lios-pol-five-phase
status: planning-approved-implementation-unverified
three_day_sprint:
  objective: "P1 cited research slice plus narrow P2 election analysis spike, if compatible"
  full_product_promise: false
  require_clean_install_and_tests: true
rules:
  local_first: true
  zero_cost_core: true
  reuse_before_build: true
  one_capability_one_owner: true
  fork_only_for_required_modifications: true
  source_and_model_provenance_required: true
  no_individual_political_preference_inference: true
  legacy_milestones_are_not_phases: true
  no_mandatory_paid_or_hosted_services: true
  openclaw_required_for_release: true
  one_canonical_artifact_and_team_state: true
  no_parallel_AI_or_chat_backend: true
required_integrations:
  openclaw:
    upstream: openclaw/openclaw
    role: "Required maintained local channel/device/skills/agent gateway; Dotpol AI/data remain authoritative"
    foundation_phase: P1
    teams_phase: P4
    release_phase: P5
    required_for_release: true
    status: "required-not-integrated"
    required_checks: [version_pin, sandbox, gateway_auth, channel_pairing, tool_permissions, source_licences, data_egress, local_first_zero_paid_path, gateway_restart_recovery]
    policy: "Dotpol PydanticAI owns research; OpenClaw may call only approved scoped Dotpol tools"
selected_runtime_authority:
  ai: "PydanticAI via platform/ai"
  operational_local: SQLite
  analytics: DuckDB
  retrieval: LanceDB
  UI: Next.js
  service_orchestration: "Docker Compose optional; K3s not required"
  donor_adoption: "dependency | isolated-service | selectively-adapted-fork | reference"
  active_implementation_pr: 11
  full_release_requires_openclaw_gateway: true
  UI_task_issue: 12
phases:
  - id: P1
    tracking_issue: 6
    work_packages: [P1.01, P1.02, P1.03, P1.04, P1.05, P1.06, P1.07, P1.08, P1.09, P1.10, P1.11, P1.12]
    title: Foundation, AI, data and cited research
    legacy_milestones: [0, 1, 2, 3]
    status: not-verified
    owner_lanes: [platform, web, ai-research]
    depends_on: []
    checkpoints:
      - "Architecture/contracts/licences reviewed and owners named"
      - "Next.js and FastAPI start locally without paid credentials"
      - "Project and source records persist after restart"
      - "Import authorized source data; inspect provenance"
      - "Search/citations and no-evidence abstention work"
      - "Chat artifacts open in workbench and can be saved/reopened"
      - "OpenClaw local gateway discovery and readiness contract tested (P1.11)"
      - "OSS UI uses one Next.js renderer with tested FastAPI adapter and artifact ID"
    exit_evidence: "Clean-install J1 journey with local/no-model and model-enabled tests"
  - id: P2
    tracking_issue: 7
    work_packages: [P2.01, P2.02, P2.03, P2.04, P2.05, P2.06, P2.07, P2.08, P2.09, P2.10, P2.11]
    title: Elections, GIS, statistics, psephology and field pilot
    legacy_milestones: [4, 5, 6]
    status: not-verified
    owner_lanes: [data, gis-analytics, elections, surveys-fieldops]
    depends_on: [P1]
    checkpoints:
      - "Source-linked Indian public election data ingested and validated"
      - "Versioned constituency/booth geographies reconciled"
